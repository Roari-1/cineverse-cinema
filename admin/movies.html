<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Movie Management | CineVerse Admin</title><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/responsive.css"></head><body><div class="admin-layout"><aside class="sidebar"><a class="brand" href="dashboard.html"><img src="../assets/logo/cineverse-logo.svg" alt="CineVerse"></a><nav class="side-links"><a href="dashboard.html">Dashboard</a><a href="movies.html">Movies</a><a href="showtimes.html">Showtimes</a><a href="reservations.html">Reservations</a><a href="users.html">Customers</a><a href="transactions.html">Transactions</a><a href="reports.html">Reports</a><a href="settings.html">Settings</a><button class="btn btn-secondary" data-admin-logout>Logout</button></nav></aside><main class="admin-main"><div class="admin-mobile panel"><a href="dashboard.html">Dashboard</a> · <a href="movies.html">Movies</a> · <a href="showtimes.html">Showtimes</a> · <button data-admin-logout class="btn btn-secondary">Logout</button></div><div class="admin-top"><div><div class="eyebrow">CineVerse Admin</div><h1>Movie Management</h1></div><div id="adminName" class="muted"></div></div><section class="panel"><h2 id="formTitle">Add Movie</h2><form id="movieForm" class="form-grid"><div class="field"><label>Movie title</label><input id="title" required></div><div class="field"><label>Genres (comma separated)</label><input id="genres" placeholder="Action, Adventure"></div><div class="field"><label>Poster URL/path</label><input id="posterUrl" required></div><div class="field"><label>Backdrop URL/path</label><input id="backdropUrl" required></div><div class="field"><label>Trailer URL</label><input id="trailerUrl"></div><div class="field"><label>Runtime (minutes)</label><input id="runtime" type="number" min="1" required></div><div class="field"><label>Age rating</label><input id="ageRating" required></div><div class="field"><label>Release date</label><input id="releaseDate" type="date" required></div><div class="field"><label>Director</label><input id="director"></div><div class="field"><label>Cast</label><input id="cast"></div><div class="field full"><label>Synopsis</label><textarea id="synopsis" required></textarea></div><div class="field"><label>Ticket price</label><input id="ticketPrice" type="number" min="1" step="0.01" required></div><div class="field"><label>Status</label><select id="status" required><option value="now-showing">Now Showing</option><option value="coming-soon">Coming Soon</option><option value="archived">Archived</option></select></div><div class="field"><label><input id="featured" type="checkbox" style="width:auto;min-height:auto"> Featured movie</label></div><div class="field full"><button id="saveMovie" class="btn btn-primary">Save Movie</button> <button id="cancelEdit" type="button" class="btn btn-secondary hidden">Cancel Edit</button></div></form></section><section class="panel" style="margin-top:24px"><div class="filters"><input id="search" placeholder="Search movies"><select id="filterStatus"><option value="">All statuses</option><option value="now-showing">Now Showing</option><option value="coming-soon">Coming Soon</option><option value="archived">Archived</option></select></div><div class="table-wrap"><table><thead><tr><th>Title</th><th>Genres</th><th>Status</th><th>Price</th><th>Actions</th></tr></thead><tbody id="movieRows"></tbody></table></div></section></main></div><div class="toast-wrap"></div><script type="module" src="../js/admin/movies.js"></script></body></html>
